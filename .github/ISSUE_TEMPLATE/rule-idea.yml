name: Rule idea
description: Suggest a mistake sloplint should catch
labels: [rule-idea]
body:
  - type: textarea
    id: mistake
    attributes:
      label: The mistake
      description: What does the bad code or text look like? Paste a real example if you can.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: How a tool could check it
      description: What makes it verifiable rather than a matter of taste?
