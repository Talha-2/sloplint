name: False positive
description: sloplint flagged code that is actually fine
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule
      description: The rule name shown at the end of the finding.
      placeholder: phantom-import
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: The smallest snippet that triggers the finding, plus the relevant part of package.json or requirements.txt if it's an import.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: sloplint output
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this is fine
    validations:
      required: true
